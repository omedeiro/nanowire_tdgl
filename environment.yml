name: tdgl3d
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - h5py>=3.8
  - tqdm>=4.65
  - pytest>=7.0
  - pytest-cov>=4.0
  - pip
  - pip:
      - ruff>=0.1
      # Reference implementations the cross-tool benchmarks measure against;
      # see packages/tdgl3d/benchmarks/README.md.
      - tdgl        # pyTDGL — 2-D TDGL on a triangular mesh
      - superscreen # thin-film London magnetostatics
      - -e .
