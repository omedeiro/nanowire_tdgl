name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.10"
      - run: ruff check packages/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: |
          pip install -e "packages/tdgl3d[dev]"
          pip install -e "packages/schema[dev]"
          pip install -e "packages/tdgl3d-server[dev]"
      - name: Run tests
        run: |
          python3 -m pytest packages/tdgl3d/tests -q --cov=tdgl3d --cov-report=xml:coverage-tdgl3d.xml
          python3 -m pytest packages/schema/tests -q --cov=tdgl3d_schema --cov-report=xml:coverage-schema.xml
          python3 -m pytest packages/tdgl3d-server/tests -q --cov=tdgl3d_server --cov-report=xml:coverage-server.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage-tdgl3d.xml,coverage-schema.xml,coverage-server.xml
          fail_ci_if_error: false
